spring:
  application:
    name: api-quality-guard

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/api_quality_guard?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

  # Flyway：启动时自动执行 db/migration 下未执行过的迁移脚本
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8

server:
  port: 8080

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 主键策略：数据库自增
      id-type: auto
      # 逻辑删除：实体中含有 deleted 字段时自动生效
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 诊断 Agent（独立 Python 服务）地址与超时
aqg:
  agent:
    base-url: ${AQG_AGENT_BASE_URL:http://localhost:8090}
    timeout-seconds: ${AQG_AGENT_TIMEOUT_SECONDS:120}
